# Builds "Notch Assistant.app" for Apple silicon and attaches it to a GitHub release when a
# version tag (v1.2.3, matching Cargo.toml) is pushed. The Homebrew cask in shmileee/homebrew-tap
# downloads that zip.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }

      - uses: Swatinem/rust-cache@v2

      - name: Build and zip the app
        run: make dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/NotchAssistant-*-arm64.zip)
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes
