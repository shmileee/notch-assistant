# Builds "Notch Assistant.app" for Apple silicon and attaches it to a GitHub release when a
# version tag (v1.2.3, matching Cargo.toml) is pushed. The Homebrew cask in shmileee/homebrew-tap
# downloads that zip.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }

      - uses: Swatinem/rust-cache@v2

      # The app is signed with the project's own certificate, so macOS keeps its permissions
      # across upgrades; an ad-hoc release would make every user allow Calendar again.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "The MACOS_SIGNING_P12 secret isn't set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" >/dev/null
          # codesign looks only in keychains on the search list; --keychain just picks among them.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and zip the app
        env:
          CODESIGN_IDENTITY: Notch Assistant Signing
        run: |
          make dist
          codesign -dvv "target/bundle.noindex/Notch Assistant.app" 2>&1 | grep -q "Authority=Notch Assistant Signing"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/NotchAssistant-*-arm64.zip)
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes
